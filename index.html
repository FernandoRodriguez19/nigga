<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b1220" />
    <title>Futbol Racha 1v1</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #070b14;
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 0%, #17243d 0%, #070b14 60%),
          #070b14;
      }

      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #game canvas {
        display: block;
        image-rendering: auto;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.65);
        border-radius: 6px;
      }

      #hint {
        position: fixed;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        color: #55648a;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hint">Enter para empezar &nbsp;&middot;&nbsp; se juega con el teclado</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
